[project]
name = "rag"
version = "0.1.0"
description = "Lokalne wyszukiwanie wiedzy dla Codexa"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["lancedb>=0.20", "mcp>=1.0,<2", "sentence-transformers>=3.0"]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
