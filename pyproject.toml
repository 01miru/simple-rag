[project]
name = "rag"
version = "0.1.0"
description = "Lokalne wyszukiwanie wiedzy dla Codexa"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["lancedb>=0.20", "mcp>=1.0,<2", "sentence-transformers>=3.0"]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
